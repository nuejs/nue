
<header :is="pagehead">
  <a href="/blog/">Blog</a> / <pretty-date :date/> • <span>{ author }</span>
</header>

<!-- latest four entries -->
<latest-entries class="grid">
  <a :each="page in blog.slice(0, 4)" href="{ page.url }">
    <figure>
      <img src="{ getHero(page) }">
    </figure>
    <p><small><pretty-date :date="page.date"/></small></p>
    <h3>{ page.title }</h3>
    <p>{{ markdown(page.description) }}</p>
  </a>

  <script>
    getHero(page) {
      return page.thumb || `/${ page.dir }/${ page.og }`
    }
  </script>
</latest-entries>

<!-- the rest -->
<entry-list class="entry-list">
  <p :each="page in blog.slice(4)">
    <pretty-date :date="page.date"/>
    <a href="{ page.url }">{{ markdown(page.title) }}</a>
  </p>
</entry-list>

<time :is="pretty-date">
  { pretty }

  <script>
    const DATE_FORMAT = new Intl.DateTimeFormat('en-US', {
      month: 'short', day: 'numeric', year: 'numeric'
    })
    let date = this.date || new Date()
    if (typeof date == 'string') date = new Date(date)
    this.pretty = DATE_FORMAT.format(date)
  </script>
</time>
