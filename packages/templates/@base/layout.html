
<!-- global header -->
<header>
  <a href="/" data-transition="false">
    <strong class="logo">{{ markdown(brand_name) }}</strong>
  </a>

  <nav class="mastnav">
    <a :each="el in nav.master" href="{ el.url }">{ el.label }</a>
  </nav>

  <nav>
    <a :each="el in nav.toolbar"
      data-transition="{ el.transition }"
      target="{ el.target }"
      href="{ el.url }">

      <button class="{ el.class }">
        <img :if="el.img" src="{ el.img }">
        { el.label }
      </button>
    </a>
  </nav>
</header>


<!-- global footer -->
<footer>
  <strong class="logo">{{ markdown(brand_name) }}</strong>

  <nav>
    <a :each="el in nav.footer" href="{ el.url }">{ el.label }</a>
  </nav>
</footer>

<!-- contact form -->
<form :is="contact-us" action="/api/feedback">
  <p><input type="email" name="email" placeholder="Your email" required></p>
  <p>
    <textarea name="comment"
      placeholder="{ placeholder || 'Optional comment' }"></textarea>
  </p>
  <p><button class="primary">{ button || 'Notify me' }</button></p>
</form>
