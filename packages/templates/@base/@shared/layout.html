
<!-- global header -->
<header>
  <a href="/">
    <strong class="logo">{ brand_name }</strong>
  </a>

  <nav class="mastnav">
    <a :each="el in nav.master" href="{ el.url }">{ el.label }</a>
  </nav>

  <aside>
    <a :each="el in nav.toolbar" href="{ el.url }">
      <button class="{ el.class }">{ el.label }</button>
    </a>
  </aside>
</header>


<!-- global footer -->
<footer>
  <strong class="logo">{ brand_name }</strong>

  <nav>
    <a :each="el in nav.footer" href="{ el.url }">{ el.label }</a>
  </nav>
</footer>

<!-- contact form -->
<form :is="contact-us" action="/api/feedback">
  <p><input type="email" name="email" placeholder="Your email" required></p>
  <p>
    <textarea name="comment"
      placeholder="{ placeholder || 'Optional comment' }"></textarea>
  </p>
  <p><button class="primary">{ button || 'Notify me' }</button></p>
</form>
