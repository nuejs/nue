
<aside>
  <label class="breadcrumb">
    <input type="checkbox" id="toc-toggle" hidden>
    <b>☰</b> Documentation › { title }
  </label>

  <toc :items="topics"/>
</aside>

<toc class="toc">
  <nav :each="cat, i in cats">
    <h4>{ cat.title }</h4>
    <p :each="label in cat.items">
      <a href="#">{ label }</a>
    </p>
  </nav>

  <script>
    this.cats = Object.keys(this.items).map(title => {
      const items = this.items[title]
      return { title, items }
    })
  </script>
</toc>
