
<aside>
  <label class="breadcrumb">
    <input type="checkbox" id="toc-toggle" hidden>
    <b>☰</b> Documentation › { title }
  </label>

  <toc :items="topics"/>
</aside>

<toc class="toc">
  <nav :each="cat, i in cats">
    <h4>{ cat.title }</h4>
    <p :each="item in cat.items">
      <a href="{ item.url }">{ item.label }</a>
    </p>
  </nav>

  <script>
    this.cats = Object.keys(this.items).map(title => {
      const items = this.items[title].map(item => {
        let [ label, url ] = item.split(' | ')
        if (!url) url = label.toLowerCase().replaceAll(' ', '-')
        return { label, url }
      })
      return { title, items }
    })
  </script>
</toc>
