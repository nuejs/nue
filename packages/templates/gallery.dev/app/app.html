
<!doctype dhtml>

<gallery class="gallery">
  <a :each="el, i in items" href="/{ el.key }">
    <gallery-item :bind="el"/>
  </a>
</gallery>

<gallery-item class="item">
  <header>
    <h2>{ title }</h2>
    <p>{ desc }</p>
  </header>

  <figure class="{ effects }">
    <img src="{ src }" class="img-{ index }">
  </figure>
</gallery-item>
