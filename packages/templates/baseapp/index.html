<!doctype dhtml>

<script>
  import { state } from 'state'
  state.setup({ route: '/:item', autolink: true })
</script>

<article>
  <div/>

  <script>
    state.on('item', async ({ item }) => {
      const res = await fetch(item ? `/api/item/${ item }` : '/api/items')
      const data = await res.json()

      item ? this.mount('item', ':first-child', data)
        : this.mount('gallery', ':first-child', { items: data })
    })

    state.init()
  </script>
</article>

<gallery class="gallery">
  <a :each="el, i in items" href="/{ el.id }">
    <item :bind="el"/>
  </a>
</gallery>

<item class="item">
  <header>
    <h2>{ title }</h2>
    <p>{ desc }</p>
    <a href="/"><button class="secondary">Back to gallery</button></a>
  </header>

  <figure>
    <img src="/base.jpg" class="img-{ index }" --index="{ index }">
  </figure>
</item>
